version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: salon_postgres
    restart: always
    environment:
      POSTGRES_USER: salon_user
      POSTGRES_PASSWORD: salon_secure_password_123
      POSTGRES_DB: salon_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon_user -d salon_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
